# Maka Eval patch layer for the DeepSeek Harness arm, applied over the stock
# `headless` profile.
#
# It reproduces the model-facing surface of the harness's own
# examples/jsonrpc-agent/minimal.cordis.yml — the composition BENCHMARK.md names
# for benchmark runs — while keeping the CLI as the process entry point. The
# wire was compared request-for-request against that composition: identical tool
# names, byte-identical tool schemas, and a byte-identical system prompt.
#
# The one deliberate deviation from upstream is reasoning strength. The minimal
# composition configures neither `thinking` nor `reasoningEffort`, and the
# adapter default resolves to reasoning_effort=high on the wire, which would
# leave this arm reasoning less than every other arm in the cohort.
#
# The tool surface is upstream's own: persistent bash and the string-replace
# editor, with no glob or grep. That is the harness's minimal design, not a gap
# to fill.

- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: max

# The stock headless profile spends an extra 64-token model call naming the
# session. Maka's Eval profile has no equivalent, and the cost would land in
# this arm's metering.
- id: session-title-llm
  disabled: true

# minimal.cordis.yml sets both of these through agent-spine-demo; the headless
# bundle carries its own persona and prepends a harness identity section.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    persona: You are a helpful software engineer assistant.

# Upstream's minimal composition drives a persistent PTY shell whose state
# survives across calls. The headless bundle's foreground bash is a different
# tool, so it is replaced rather than reconfigured.
- id: tool-bash
  disabled: true

- insert:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'
    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000
    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

# Everything the minimal composition does not mount. WebSearch and FetchURL are
# also removed structurally at the Eval metering proxy; disabling them here
# keeps the request surface honest rather than relying on that alone.
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: plan-mode
  disabled: true
